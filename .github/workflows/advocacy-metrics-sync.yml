name: Sync Advocacy Metrics

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-advocacy-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync advocacy metrics snapshot
        env:
          # Point at the deployed site, or override with the full endpoint URL.
          SITE_URL: ${{ secrets.SITE_URL }}
          ADVOCACY_ASSIST_ENDPOINT: ${{ secrets.ADVOCACY_ASSIST_ENDPOINT }}
        run: npm run sync:advocacy-metrics

      - name: Commit and push snapshot changes
        run: |
          if git diff --quiet -- src/data/advocacy-metrics.ts; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/advocacy-metrics.ts
          git commit -m "chore: sync advocacy metrics snapshot"
          git push
