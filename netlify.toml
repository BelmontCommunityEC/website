[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Private admin area (metrics dashboard and content drafting): only Netlify
# Identity users with the `admin` role are served these pages; everyone else is
# sent to the sign-in page, which stays public. The data and drafting endpoints
# check the role again in their functions.
[[redirects]]
  from = "/admin"
  to = "/admin/metrics/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/login"
  to = "/admin/login/"
  status = 200
  force = true

[[redirects]]
  from = "/admin/login/*"
  to = "/admin/login/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/*"
  to = "/admin/login/"
  status = 302
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"
    Referrer-Policy = "same-origin"
